[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optionslib"
version = "0.1.0"
description = "Black-Scholes pricing, an implied volatility solver and options-chain tooling for risk-neutral density extraction from SPX options"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# The options-chain data layer (optionslib.chain) needs pandas; the pricing core and solver do not.
# pyarrow is only for writing results to Parquet.
chain = ["pandas>=2.0", "pyarrow"]
dev = ["pytest", "pytest-cov", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["F401", "F841"]